services:
  mysql:
    image: mysql:8.0
    container_name: movilidad-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: movilidad
      TZ: Europe/Madrid
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ridehailing

  grafana:
    image: grafana/grafana:latest
    container_name: movilidad-grafana
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      MYSQL_APP_READER_PASSWORD: ${MYSQL_APP_READER_PASSWORD}
      MYSQL_DB_METRICS_PASSWORD: ${MYSQL_DB_METRICS_PASSWORD}
      TZ: Europe/Madrid
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - ridehailing

volumes:
  mysql_data:
  grafana_data:

networks:
  ridehailing:
